<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S — Interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#050a11;
    --panel:#081420;
    --panel-2:#0a1a29;
    --line:#163040;
    --line-bright:#245268;
    --cyan:#54d9ff;
    --cyan-dim:#2b8aa8;
    --amber:#ffb454;
    --red:#ff5d5d;
    --text:#d7ecf5;
    --text-dim:#5d7c8c;
    --text-faint:#365164;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  html,body{
    height:100%;
    background:var(--void);
    color:var(--text);
    font-family:'Rajdhani', sans-serif;
    overflow:hidden;
  }

  body{
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:56px 56px;
    background-position:center;
    background-color:var(--void);
    position:relative;
  }

  body::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(ellipse at center, transparent 0%, rgba(5,10,17,0.55) 55%, var(--void) 100%);
    pointer-events:none;
    z-index:1;
  }

  .mono{ font-family:'JetBrains Mono', monospace; }

  /* ================= SHELL ================= */
  .shell{
    position:relative;
    z-index:2;
    height:100vh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:22px 28px 18px;
    gap:14px;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:12px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .brand .mark{
    font-size:22px;
    font-weight:700;
    letter-spacing:0.14em;
    color:var(--text);
  }
  .brand .mark span{ color:var(--cyan); }
  .brand .sub{
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.08em;
  }
  .top-readouts{
    display:flex;
    gap:26px;
    align-items:baseline;
  }
  .readout{ text-align:right; }
  .readout .val{
    font-size:15px;
    color:var(--cyan);
    letter-spacing:0.04em;
  }
  .readout .lbl{
    font-size:10.5px;
    color:var(--text-faint);
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-top:2px;
  }

  /* ---------- MAIN GRID ---------- */
  .main{
    display:grid;
    grid-template-columns:250px 1fr 320px;
    gap:20px;
    min-height:0;
  }

  .panel{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    padding:16px 18px;
    min-height:0;
    display:flex;
    flex-direction:column;
  }

  .panel-title{
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
    flex-shrink:0;
  }
  .panel-title::before{
    content:"";
    width:6px; height:6px;
    background:var(--cyan);
    box-shadow:0 0 6px var(--cyan);
    flex-shrink:0;
  }

  /* ---------- LEFT: DIAGNOSTICS ---------- */
  .diag-item{ margin-bottom:16px; }
  .diag-item .row{
    display:flex; justify-content:space-between;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:6px;
    letter-spacing:0.03em;
  }
  .diag-item .row b{ color:var(--text); font-weight:500; }
  .bar{
    height:5px;
    background:#0d1e2b;
    border:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .bar i{
    display:block; height:100%;
    background:linear-gradient(90deg, var(--cyan-dim), var(--cyan));
    transition:width 0.6s ease;
  }

  .divider{
    height:1px;
    background:var(--line);
    margin:6px 0 18px;
  }

  .log-mini{
    flex:1;
    overflow-y:auto;
    font-size:11px;
    color:var(--text-faint);
    line-height:1.9;
    padding-right:4px;
  }
  .log-mini::-webkit-scrollbar{width:3px;}
  .log-mini::-webkit-scrollbar-thumb{background:var(--line-bright);}

  /* ---------- CENTER: CORE ---------- */
  .core-panel{
    align-items:center;
    justify-content:center;
    position:relative;
    padding-bottom:8px;
  }

  .core-status{
    position:absolute;
    top:16px;
    left:18px;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--text-dim);
    display:flex; align-items:center; gap:8px;
  }
  .core-status .dot{
    width:6px; height:6px;
    background:var(--cyan);
    box-shadow:0 0 6px var(--cyan);
    animation:blink 2.4s infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  .core-wrap{
    position:relative;
    width:min(360px, 40vh);
    height:min(360px, 40vh);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .core-wrap svg{ position:absolute; inset:0; width:100%; height:100%; }

  .ring-outer{ transform-origin:50% 50%; animation:spin 40s linear infinite; }
  .ring-mid{ transform-origin:50% 50%; animation:spin 26s linear infinite reverse; }
  .ring-ticks{ transform-origin:50% 50%; animation:spin 90s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .core-center{
    width:34%; height:34%;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d9f7ff, var(--cyan) 40%, #0f4a5c 100%);
    box-shadow:0 0 40px 6px rgba(84,217,255,0.45), 0 0 90px 20px rgba(84,217,255,0.15);
    position:relative;
    z-index:2;
    transition:box-shadow 0.4s ease, transform 0.4s ease;
  }
  .core-wrap.listening .core-center{
    box-shadow:0 0 55px 12px rgba(84,217,255,0.75), 0 0 130px 30px rgba(84,217,255,0.3);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }

  .core-hint{
    margin-top:22px;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.06em;
    text-align:center;
    min-height:18px;
  }
  .core-hint b{ color:var(--cyan); font-weight:500; }

  /* ---------- RIGHT: CONVERSATION ---------- */
  .convo-panel{ min-height:0; }
  .convo-feed{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:14px;
    padding-right:6px;
    margin-bottom:14px;
  }
  .convo-feed::-webkit-scrollbar{ width:4px; }
  .convo-feed::-webkit-scrollbar-thumb{ background:var(--line-bright); }

  .msg{ max-width:100%; }
  .msg .who{
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .msg.user .who{ color:var(--text-faint); }
  .msg.jarvis .who{ color:var(--cyan-dim); }
  .msg .text{
    font-size:13.5px;
    line-height:1.5;
    color:var(--text);
    white-space:pre-wrap;
  }
  .msg.user .text{ color:var(--text-dim); }
  .msg.jarvis{
    border-left:2px solid var(--cyan-dim);
    padding-left:10px;
  }
  .msg.system .text{ color:var(--text-faint); font-style:italic; }
  .msg.system{ border-left:2px solid var(--line-bright); padding-left:10px; }

  .confirm-card{
    border:1px solid var(--amber);
    background:rgba(255,180,84,0.06);
    padding:12px 14px;
    margin-top:8px;
    font-size:12.5px;
  }
  .confirm-card .row{ margin-bottom:6px; color:var(--text-dim); }
  .confirm-card .row b{ color:var(--text); font-weight:500; }
  .confirm-card .body{
    white-space:pre-wrap;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    line-height:1.5;
    max-height:160px;
    overflow-y:auto;
    border:1px solid var(--line);
    padding:8px;
    margin:6px 0 10px;
  }
  .confirm-actions{ display:flex; gap:8px; }
  .confirm-actions button{
    flex:1;
    padding:8px 0;
    border:1px solid var(--line-bright);
    background:var(--panel-2);
    color:var(--text);
    font-family:'Rajdhani', sans-serif;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .confirm-actions .btn-send{ border-color:var(--cyan); color:var(--cyan); }
  .confirm-actions .btn-send:hover{ background:rgba(84,217,255,0.12); }
  .confirm-actions .btn-cancel:hover{ background:rgba(255,93,93,0.1); color:var(--red); border-color:var(--red); }
  .confirm-actions button:disabled{ opacity:0.4; cursor:default; }

  /* ---------- BOTTOM: COMMAND ---------- */
  .cmd-bar{
    border:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    padding:4px 4px 4px 16px;
    gap:10px;
    clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  }
  .cmd-bar .caret{ color:var(--cyan); font-size:15px; }
  .cmd-bar input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:13.5px;
    padding:12px 0;
    letter-spacing:0.02em;
  }
  .cmd-bar input::placeholder{ color:var(--text-faint); }

  .mic-btn{
    width:38px; height:38px;
    border:1px solid var(--line-bright);
    background:var(--panel-2);
    color:var(--cyan);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background 0.2s ease, box-shadow 0.2s ease;
  }
  .mic-btn:hover{ background:#0d2334; }
  .mic-btn.active{
    background:var(--cyan);
    color:#04141c;
    box-shadow:0 0 16px rgba(84,217,255,0.6);
  }
  .mic-btn svg{ width:16px; height:16px; }

  .send-btn{
    width:38px; height:38px;
    border:1px solid var(--line-bright);
    background:var(--panel-2);
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .send-btn:hover{ background:#0d2334; color:var(--cyan); }
  .send-btn svg{ width:15px; height:15px; }

  ::selection{ background:var(--cyan); color:#04141c; }

  /* scrollable areas focus visibility */
  input:focus-visible, .mic-btn:focus-visible, .send-btn:focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:2px;
  }

  @media (max-width:980px){
    .main{ grid-template-columns:1fr; grid-template-rows:auto auto auto; }
    .shell{ overflow-y:auto; height:auto; min-height:100vh; }
  }
</style>
</head>
<body>

<div class="shell">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">
      <div class="mark">J<span>.</span>A<span>.</span>R<span>.</span>V<span>.</span>I<span>.</span>S</div>
      <div class="sub mono">PERSONAL INTERFACE — BUILD 4.1</div>
    </div>
    <div class="top-readouts">
      <div class="readout">
        <div class="val mono" id="clock">00:00:00</div>
        <div class="lbl">Local Time</div>
      </div>
      <div class="readout">
        <div class="val mono" id="dateStr">—</div>
        <div class="lbl">Date</div>
      </div>
      <div class="readout">
        <div class="val mono" style="color:var(--amber)" id="statusVal">Standby</div>
        <div class="lbl">System Status</div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- LEFT PANEL -->
    <div class="panel">
      <div class="panel-title">Diagnostics</div>

      <div class="diag-item">
        <div class="row"><span>Core Power</span><b id="d-power">92%</b></div>
        <div class="bar"><i id="b-power" style="width:92%"></i></div>
      </div>
      <div class="diag-item">
        <div class="row"><span>Processing Load</span><b id="d-load">18%</b></div>
        <div class="bar"><i id="b-load" style="width:18%"></i></div>
      </div>
      <div class="diag-item">
        <div class="row"><span>Network Link</span><b id="d-net">100%</b></div>
        <div class="bar"><i id="b-net" style="width:100%"></i></div>
      </div>
      <div class="diag-item">
        <div class="row"><span>Memory Array</span><b id="d-mem">64%</b></div>
        <div class="bar"><i id="b-mem" style="width:64%"></i></div>
      </div>

      <div class="divider"></div>
      <div class="panel-title" style="margin-bottom:10px;">System Log</div>
      <div class="log-mini mono" id="sysLog"></div>
    </div>

    <!-- CENTER PANEL -->
    <div class="panel core-panel">
      <div class="core-status"><span class="dot"></span><span id="coreStatusLbl">IDLE</span></div>
      <div class="core-wrap" id="coreWrap">
        <svg viewBox="0 0 200 200">
          <circle class="ring-ticks" cx="100" cy="100" r="94" fill="none" stroke="var(--line-bright)" stroke-width="1" stroke-dasharray="1 7"/>
          <circle class="ring-outer" cx="100" cy="100" r="80" fill="none" stroke="var(--cyan-dim)" stroke-width="1.2" stroke-dasharray="120 20 4 20"/>
          <circle class="ring-mid" cx="100" cy="100" r="62" fill="none" stroke="var(--cyan)" stroke-width="1.6" stroke-dasharray="8 6" opacity="0.7"/>
        </svg>
        <div class="core-center" id="coreCenter"></div>
      </div>
      <div class="core-hint" id="coreHint">Type a command below, or press <b>the mic</b> to speak.</div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="panel convo-panel">
      <div class="panel-title">Conversation</div>
      <div class="convo-feed" id="convoFeed"></div>
    </div>

  </div>

  <!-- COMMAND BAR -->
  <div class="cmd-bar">
    <span class="caret mono">&gt;</span>
    <input id="cmdInput" class="mono" type="text" placeholder="Ask JARVIS anything…" autocomplete="off" />
    <button class="mic-btn" id="micBtn" title="Speak a command" aria-label="Speak a command">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
      </svg>
    </button>
    <button class="mic-btn active" id="speakBtn" title="Voice replies: on" aria-label="Toggle spoken replies">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
        <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
      </svg>
    </button>
    <button class="send-btn" id="sendBtn" title="Send" aria-label="Send command">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

</div>

<script>
(function(){
  // Point this at wherever jarvis_server.py is running.
  const SERVER_URL = 'https://jarvis-backend-demo.onrender.com';

  const clock = document.getElementById('clock');
  const dateStr = document.getElementById('dateStr');
  const statusVal = document.getElementById('statusVal');
  const coreStatusLbl = document.getElementById('coreStatusLbl');
  const coreWrap = document.getElementById('coreWrap');
  const coreHint = document.getElementById('coreHint');
  const sysLog = document.getElementById('sysLog');
  const convoFeed = document.getElementById('convoFeed');
  const cmdInput = document.getElementById('cmdInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const speakBtn = document.getElementById('speakBtn');

  // ---- clock ----
  function tick(){
    const now = new Date();
    clock.textContent = now.toLocaleTimeString('en-GB', {hour12:false});
    dateStr.textContent = now.toLocaleDateString('en-US', {month:'short', day:'2-digit', year:'numeric'});
  }
  tick();
  setInterval(tick, 1000);

  // ---- system log ----
  const bootLines = [
    'Boot sequence complete',
    'Voice recognition module online',
    'Network handshake established',
    'Sensor array calibrated',
    'Awaiting input…'
  ];
  function logLine(text){
    const t = new Date().toLocaleTimeString('en-GB', {hour12:false});
    const row = document.createElement('div');
    row.textContent = '[' + t + '] ' + text;
    sysLog.appendChild(row);
    sysLog.scrollTop = sysLog.scrollHeight;
  }
  bootLines.forEach((l, i) => setTimeout(() => logLine(l), i * 260));

  // ---- diagnostics drift ----
  function jitter(el, bar, base, range){
    const val = Math.max(3, Math.min(99, base + (Math.random()*range - range/2)));
    el.textContent = Math.round(val) + '%';
    bar.style.width = val + '%';
    return val;
  }
  setInterval(() => {
    jitter(document.getElementById('d-power'), document.getElementById('b-power'), 91, 6);
    jitter(document.getElementById('d-net'), document.getElementById('b-net'), 98, 4);
    jitter(document.getElementById('d-mem'), document.getElementById('b-mem'), 64, 10);
  }, 2600);

  // ---- conversation ----
  function addMsg(who, text){
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + who;
    const label = document.createElement('div');
    label.className = 'who';
    label.textContent = who === 'user' ? 'You' : (who === 'jarvis' ? 'JARVIS' : 'System');
    const body = document.createElement('div');
    body.className = 'text';
    body.textContent = text;
    wrap.appendChild(label);
    wrap.appendChild(body);
    convoFeed.appendChild(wrap);
    convoFeed.scrollTop = convoFeed.scrollHeight;
    return wrap;
  }

  function addConfirmCard(preview, onDecide){
    const wrap = addMsg('jarvis', '');
    wrap.querySelector('.text').remove();
    const card = document.createElement('div');
    card.className = 'confirm-card';
    card.innerHTML = `
      <div class="row"><b>To:</b> ${escapeHtml(preview.to)}</div>
      <div class="row"><b>Subject:</b> ${escapeHtml(preview.subject)}</div>
      ${preview.attachment ? `<div class="row"><b>Attachment:</b> ${escapeHtml(preview.attachment)}</div>` : `<div class="row"><b>Attachment:</b> none</div>`}
      <div class="body">${escapeHtml(preview.body)}</div>
      <div class="confirm-actions">
        <button class="btn-send">Send</button>
        <button class="btn-cancel">Cancel</button>
      </div>`;
    wrap.appendChild(card);
    convoFeed.scrollTop = convoFeed.scrollHeight;

    const btnSend = card.querySelector('.btn-send');
    const btnCancel = card.querySelector('.btn-cancel');
    const lock = () => { btnSend.disabled = true; btnCancel.disabled = true; };
    btnSend.addEventListener('click', () => { lock(); onDecide(true); });
    btnCancel.addEventListener('click', () => { lock(); onDecide(false); });
  }

  // Strips markdown syntax so replies read as clean plain text -- the HUD
  // is a plain-text terminal, not a markdown renderer, and raw ** / # / `
  // characters both look bad on screen and get read aloud awkwardly.
  function cleanText(text){
    if (!text) return text;
    let t = text;
    t = t.replace(/```[\s\S]*?```/g, m => m.replace(/```/g, ''));   // code fences
    t = t.replace(/`([^`]+)`/g, '$1');                               // inline code
    t = t.replace(/^#{1,6}\s+/gm, '');                                // headers
    t = t.replace(/\*\*\*(.+?)\*\*\*/g, '$1');                        // bold+italic
    t = t.replace(/\*\*(.+?)\*\*/g, '$1');                            // bold
    t = t.replace(/(?<!\*)\*(?!\*)([^*\n]+?)\*(?!\*)/g, '$1');        // italic *x*
    t = t.replace(/__(.+?)__/g, '$1');                                // bold __x__
    t = t.replace(/(?<!_)_(?!_)([^_\n]+?)_(?!_)/g, '$1');             // italic _x_
    t = t.replace(/^\s*[-*+]\s+/gm, '\u2022 ');                       // bullets -> •
    t = t.replace(/^\s*\d+\.\s+/gm, (m) => m.trim() + ' ');           // "1. " stays, tidy spacing
    t = t.replace(/\n{3,}/g, '\n\n');                                 // collapse blank lines
    return t.trim();
  }

  function typeMsg(who, rawText){
    const text = cleanText(rawText);
    const wrap = addMsg(who, '');
    const body = wrap.querySelector('.text');
    const speed = 16; // ms per character -- lower = faster
    let i = 0;
    (function step(){
      body.textContent = text.slice(0, i);
      convoFeed.scrollTop = convoFeed.scrollHeight;
      if (i < text.length) {
        i++;
        setTimeout(step, speed);
      }
    })();
    return wrap;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function setBusy(isBusy){
    coreWrap.classList.toggle('listening', isBusy);
    coreStatusLbl.textContent = isBusy ? 'PROCESSING' : 'IDLE';
    statusVal.textContent = isBusy ? 'Active' : 'Standby';
    statusVal.style.color = isBusy ? 'var(--cyan)' : 'var(--amber)';
  }

  // ---- backend calls ----
  async function callServer(path, payload){
    const res = await fetch(SERVER_URL + path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload || {})
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.text || ('Server error ' + res.status));
    return data;
  }

  function handleServerReply(data){
    if (data.type === 'confirm_email') {
      if (data.text) { typeMsg('jarvis', data.text); speak(data.text); }
      addConfirmCard(data.preview, async (approved) => {
        logLine(approved ? 'Email send confirmed by user' : 'Email send cancelled by user');
        setBusy(true);
        try {
          const followup = await callServer('/api/confirm', {pending_id: data.pending_id, approved});
          setBusy(false);
          if (followup.text) { typeMsg('jarvis', followup.text); speak(followup.text); }
          logLine('Response dispatched');
        } catch (err) {
          setBusy(false);
          addMsg('system', 'Error: ' + err.message);
        }
      });
    } else if (data.type === 'error') {
      addMsg('system', 'Error: ' + data.text);
      logLine('Error: ' + data.text);
    } else {
      typeMsg('jarvis', data.text);
      speak(data.text);
      logLine('Response dispatched');
    }
  }

  async function handleSubmit(){
    const val = cmdInput.value.trim();
    if (!val) return;
    window.speechSynthesis && window.speechSynthesis.cancel();
    addMsg('user', val);
    logLine('Command received: "' + val + '"');
    cmdInput.value = '';
    setBusy(true);
    try {
      const data = await callServer('/api/chat', {message: val});
      setBusy(false);
      handleServerReply(data);
    } catch (err) {
      setBusy(false);
      addMsg('system', "Can't reach the Jarvis server at " + SERVER_URL + ". Is jarvis_server.py running?");
      logLine('Connection error: ' + err.message);
    }
  }

  sendBtn.addEventListener('click', handleSubmit);
  cmdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSubmit();
  });

  // ---- speech output (TTS) ----
  let voiceOn = true;
  let chosenVoice = null;
  function pickVoice(){
    const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    chosenVoice = voices.find(v => /en-GB/i.test(v.lang) && /male/i.test(v.name))
      || voices.find(v => /en-GB/i.test(v.lang))
      || voices.find(v => /en-US/i.test(v.lang))
      || voices[0] || null;
  }
  if (window.speechSynthesis) {
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }

  function speak(text){
    if (!voiceOn || !window.speechSynthesis || !text) return;
    const clean = cleanText(text);
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(clean);
    if (chosenVoice) utter.voice = chosenVoice;
    utter.rate = 1.0;
    utter.pitch = 0.92;
    utter.onstart = () => coreWrap.classList.add('listening');
    utter.onend = () => coreWrap.classList.remove('listening');
    utter.onerror = () => coreWrap.classList.remove('listening');
    window.speechSynthesis.speak(utter);
  }

  speakBtn.addEventListener('click', () => {
    voiceOn = !voiceOn;
    speakBtn.classList.toggle('active', voiceOn);
    speakBtn.title = voiceOn ? 'Voice replies: on' : 'Voice replies: off';
    if (!voiceOn && window.speechSynthesis) window.speechSynthesis.cancel();
    logLine(voiceOn ? 'Spoken replies enabled' : 'Spoken replies muted');
  });

  // ---- speech input (mic) ----
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let recognizing = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
      recognizing = true;
      micBtn.classList.add('active');
      coreWrap.classList.add('listening');
      coreStatusLbl.textContent = 'LISTENING';
      coreHint.innerHTML = 'Listening&hellip; speak your command.';
      logLine('Voice input started');
    };

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      cmdInput.value = transcript;
      handleSubmit();
    };

    recognition.onerror = (event) => {
      logLine('Voice input error: ' + event.error);
      addMsg('system', 'Voice input error: ' + event.error + '. Check microphone permissions.');
    };

    recognition.onend = () => {
      recognizing = false;
      micBtn.classList.remove('active');
      if (!coreWrap.classList.contains('listening') || coreStatusLbl.textContent === 'LISTENING') {
        coreWrap.classList.remove('listening');
        coreStatusLbl.textContent = 'IDLE';
      }
      coreHint.innerHTML = 'Type a command below, or press <b>the mic</b> to speak.';
    };

    micBtn.addEventListener('click', () => {
      if (recognizing) { recognition.stop(); return; }
      window.speechSynthesis && window.speechSynthesis.cancel();
      try { recognition.start(); } catch (e) { /* already started */ }
    });
  } else {
    micBtn.disabled = true;
    micBtn.style.opacity = '0.35';
    micBtn.title = 'Speech recognition not supported in this browser (try Chrome or Edge)';
  }

  // ---- boot ----
  async function boot(){
    try {
      const res = await fetch(SERVER_URL + '/api/health');
      const data = await res.json();
      if (data.groq_key_set) {
        logLine('Connected to Jarvis server (' + data.model + ')');
        typeMsg('jarvis', "Good to see you. I'm connected and listening for instructions.");
      } else {
        addMsg('system', 'Connected to the server, but GROQ_API_KEY is not set there. Set it and restart jarvis_server.py.');
      }
    } catch (e) {
      addMsg('system', "Can't reach the Jarvis server at " + SERVER_URL + ". Run: python jarvis_server.py");
      logLine('Server not reachable at boot');
    }
  }
  boot();

  cmdInput.focus();
})();
</script>
